[package]
name = "emmu-snes"
version = "0.1.0"
edition = "2024"
description = "Emmu SNES WebAssembly core"
repository = "https://github.com/EspetoRx/emmu-snes"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meru-interface = "0.3"
super-sabicom = { path = "./../../crates/emmu-super-sabicom" } # ajuste o caminho relativo conforme o Cargo.toml
wasm-bindgen = "0.2"
